<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard | Weather Diary</title>
        <meta name="description" content="Weather Diary Dashboard">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <div class="container">
            <h1>Dashboard</h1>

            <button id="darkModeBtn">🌙 Dark Mode</button>

            <p id="welcomeText">Loading user...</p>

            <form id="weatherForm">
                <input type="text" id="city" placeholder="Enter city" required>
                <button type="submit">Check weather</button>
            </form>

            <div id="weatherResult"></div>

            <form id="entryForm" style="display: none;">
                <select id="mood" required>
                    <option value="">Choose mood</option>
                    <option value="Happy">Happy</option>
                    <option value="Calm">Calm</option>
                    <option value="Tired">Tired</option>
                    <option value="Sad">Sad</option>
                    <option value="Stressed">Stressed</option>
                </select>

                <textarea id="note" placeholder="Write your diary note..." required></textarea>

                <button type="submit">Save diary entry</button>
            </form>

            <p id="message"></p>

            <div class="buttons">
                <a href="entries.html">My entries</a>
                <a href="#" id="dashboardLogoutBtn">Logout</a>
            </div>
        </div>

        <script src="js/dashboard.js"></script>
        <script src="js/theme.js"></script>
    </body>
</html>
